name: Refresh demo report

# 自动推广基建：每周用官方 MCP 重新核价并刷新公开落地页里的演示报告，
# 让陌生人看到的"实时演示"始终真实、可复现，提升 Star 转化信任度。
on:
  schedule:
    - cron: "17 3 * * 1"   # 每周一 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    # 未配置 MCD_MCP_TOKEN 密钥时自动跳过，避免报错刷屏
    if: ${{ secrets.MCD_MCP_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate demo report via official MCP
        run: node src/cli.js report --want "巨无霸,薯条,可乐" --html docs/report.html
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/report.html
          git diff --cached --quiet || git commit -m "chore: auto-refresh live demo report"
          git push
